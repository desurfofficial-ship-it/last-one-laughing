<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0e1120" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Last One Laughing - a mobile-first knockout arena prototype. Push everyone off the arena before the slippery floor takes you."
    />
    <title>Last One Laughing</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ffd23f'/%3E%3Ccircle cx='11.5' cy='13' r='2.6' fill='%2311162b'/%3E%3Ccircle cx='20.5' cy='13' r='2.6' fill='%2311162b'/%3E%3Cpath d='M10 20q6 5 12 0' stroke='%2311162b' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <!-- Phaser canvas mounts here (fixed logical resolution, responsive scale) -->
    <div id="game-root" aria-hidden="true"></div>

    <!-- Touch controls (gameplay layer, DOM-based) -->
    <div id="touch-layer" aria-hidden="true">
      <div id="joystick-zone"></div>
      <div id="joy-base"><div id="joy-stick"></div></div>
      <button id="dash-button" type="button" aria-label="Dash">
        <span class="cd-fill"></span><span class="dash-label">DASH</span>
      </button>
      <button id="pause-button" type="button" aria-label="Pause">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <rect x="2.5" y="1.5" width="4" height="13" rx="1.2" />
          <rect x="9.5" y="1.5" width="4" height="13" rx="1.2" />
        </svg>
      </button>
    </div>

    <!-- Menus (DOM-based, separate from gameplay) -->
    <div id="ui-layer">
      <div id="start-overlay" class="overlay">
        <h1>Last One<br /><span class="accent">Laughing</span></h1>
        <div class="dots" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
        <p class="tagline">Knock everyone off the arena. Don't get pushed.</p>
        <button id="btn-play" class="btn primary" type="button">Play</button>
        <p class="howto">
          <strong>Mobile:</strong> left thumb to move, DASH to slam.<br />
          <strong>Desktop:</strong> <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / arrows to move,
          <kbd>Space</kbd> to dash, <kbd>P</kbd> to pause.<br />
          Every 10s the floor turns slippery for a moment. Last one standing wins.
        </p>
      </div>

      <div id="pause-overlay" class="overlay hidden">
        <div class="panel">
          <h2>Paused</h2>
          <div class="btn-row">
            <button id="btn-resume" class="btn primary" type="button">Resume</button>
          </div>
          <div class="btn-row">
            <button id="btn-restart" class="btn ghost" type="button">Restart</button>
            <button id="btn-menu" class="btn ghost" type="button">Menu</button>
          </div>
        </div>
      </div>

      <div id="result-overlay" class="overlay hidden">
        <div class="panel">
          <h2 id="result-title">You win!</h2>
          <p id="result-sub">Last one laughing.</p>
          <div id="result-stats" class="stats"></div>
          <div class="btn-row">
            <button id="btn-restart-2" class="btn primary" type="button">Play again</button>
            <button id="btn-menu-2" class="btn ghost" type="button">Menu</button>
          </div>
        </div>
      </div>
    </div>

    <noscript>Last One Laughing requires JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
